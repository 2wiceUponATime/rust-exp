[package]
name = "rust-exp"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version = "2.1.1", default-features = false, features = [
  "full",
] }
lock_api = "0.5.0"

[build-dependencies]
dotenvy = "0.15.7"
rust-exp-build = { version = "0.1.0", path = "rust-exp-build" }

[workspace]
exclude = ["rust-exp-build"]

[lib]
test = false
bench = false

[profile.release]
codegen-units = 1

[[bin]]
name = "rust-exp"
test = false
bench = false
