[package]
name = "rust-exp"
version = "0.1.0"
edition = "2024"

[dependencies]
libm = "0.2.16"
pastey = "0.2.3"

[build-dependencies]
dotenvy = "0.15.7"
rust-exp-build = { version = "0.1.0", path = "rust-exp-build" }

[workspace]
exclude = ["rust-exp-build"]

[lib]
test = false
bench = false

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "rust-exp"
test = false
bench = false
